<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPU Profile</title>
<style>
:root { color-scheme: light dark; --line:#888; --compute:#b00020; --exchange:#067647; --sync:#9a6700; --idle:#777; }
* { box-sizing:border-box }
body { margin:0; font:13px/1.4 system-ui,sans-serif }
header { position:sticky; top:0; z-index:2; padding:12px 16px; border-bottom:1px solid var(--line); background:Canvas }
h1 { margin:0 0 8px; font-size:19px }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
input,select,button { font:inherit; padding:4px 7px }
main { padding:14px 16px; display:grid; gap:14px }
section { border:1px solid var(--line); overflow:auto }
h2 { font-size:14px; margin:0; padding:8px 10px; border-bottom:1px solid var(--line) }
canvas { display:block; background:Canvas }
#details { margin:0; padding:10px; white-space:pre-wrap; border-top:1px solid var(--line); min-height:48px }
.legend { margin-left:auto; display:flex; gap:10px }
.key::before { content:""; display:inline-block; width:10px; height:10px; margin-right:4px; background:var(--color) }
</style>
</head>
<body>
<header>
  <h1>IPU Profile</h1>
  <div class="controls">
    <span id="stats"></span>
    <label>Search <input id="search" type="search" placeholder="operation or kernel"></label>
    <label>Kind <select id="kind"><option>all</option><option>compute</option><option>exchange</option><option>synchronization</option><option>idle</option></select></label>
    <button id="zoomOut">−</button><button id="zoomIn">+</button><button id="reset">reset</button>
    <span class="legend"><span class="key" style="--color:var(--compute)">compute</span><span class="key" style="--color:var(--exchange)">exchange</span><span class="key" style="--color:var(--sync)">sync</span></span>
  </div>
</header>
<main>
  <section><h2>Aggregate work</h2><canvas id="summary"></canvas></section>
  <section><h2>Tile timeline</h2><canvas id="timeline"></canvas><pre id="details">Select a sample for details.</pre></section>
</main>
<script>
const data=__PROFILE_JSON__;
const colors={compute:"#b00020",exchange:"#067647",synchronization:"#9a6700",idle:"#777"};
const state={start:0,end:0,query:"",kind:"all"};
const timeline=document.querySelector("#timeline"),summary=document.querySelector("#summary"),details=document.querySelector("#details");
const tiles=[...data.tiles].sort((a,b)=>a.physicalTile-b.physicalTile);
const fullEnd=Math.max(1,...tiles.flatMap(t=>t.samples.map(s=>s.offset+s.duration)));
state.end=fullEnd;
document.querySelector("#stats").textContent=`${data.tileCount} tiles · ${data.sampleCount} samples · ${data.clockHz||"unknown"} Hz`;
function visible(s){
  const text=(s.operation+" "+s.kernel).toLowerCase();
  return (state.kind==="all"||s.kind===state.kind)&&(!state.query||text.includes(state.query));
}
function size(canvas,width,height){
  const ratio=devicePixelRatio||1; canvas.style.width=width+"px"; canvas.style.height=height+"px";
  canvas.width=Math.ceil(width*ratio); canvas.height=Math.ceil(height*ratio);
  const ctx=canvas.getContext("2d"); ctx.setTransform(ratio,0,0,ratio,0,0); return ctx;
}
function x(cycle,width){ return 82+(cycle-state.start)/Math.max(1,state.end-state.start)*(width-92) }
function drawSummary(){
  const width=Math.max(720,innerWidth-50), groups=new Map;
  for(const tile of tiles) for(const s of tile.samples) if(visible(s)) groups.set(s.operation,(groups.get(s.operation)||0)+s.duration);
  const rows=[...groups].sort((a,b)=>b[1]-a[1]).slice(0,30),height=Math.max(44,rows.length*19+20);
  const ctx=size(summary,width,height),max=Math.max(1,...rows.map(r=>r[1]));
  ctx.font="11px system-ui";
  rows.forEach(([name,value],i)=>{const y=8+i*19,w=(width-250)*value/max;ctx.fillStyle="#b00020";ctx.fillRect(210,y,w,14);ctx.fillStyle=getComputedStyle(document.body).color;ctx.fillText(name.slice(0,30),6,y+11);ctx.fillText(String(value),216+w,y+11)});
}
let hits=[];
function drawTimeline(){
  const width=Math.max(900,innerWidth-50),row=18,height=Math.max(50,tiles.length*row+28),ctx=size(timeline,width,height);
  hits=[]; ctx.font="10px system-ui"; ctx.strokeStyle="#888"; ctx.beginPath();ctx.moveTo(82,0);ctx.lineTo(82,height);ctx.stroke();
  tiles.forEach((tile,i)=>{const y=20+i*row;ctx.fillStyle=getComputedStyle(document.body).color;ctx.fillText(String(tile.physicalTile),4,y+11);
    for(const s of tile.samples){if(!visible(s)||s.offset+s.duration<state.start||s.offset>state.end)continue;
      const left=Math.max(82,x(s.offset,width)),right=Math.min(width-10,x(s.offset+s.duration,width));
      ctx.fillStyle=colors[s.kind]||"#777";ctx.fillRect(left,y,Math.max(1,right-left),13);hits.push({x:left,y,w:Math.max(2,right-left),h:13,tile:tile.physicalTile,s});
    }
  });
  ctx.fillStyle=getComputedStyle(document.body).color;ctx.fillText(String(Math.round(state.start)),82,11);ctx.fillText(String(Math.round(state.end)),width-70,11);
}
function redraw(){drawSummary();drawTimeline()}
timeline.addEventListener("click",event=>{const r=timeline.getBoundingClientRect(),px=event.clientX-r.left,py=event.clientY-r.top,h=hits.find(h=>px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h);
  if(h)details.textContent=JSON.stringify({tile:h.tile,...h.s},null,2);
});
document.querySelector("#search").addEventListener("input",e=>{state.query=e.target.value.toLowerCase();redraw()});
document.querySelector("#kind").addEventListener("change",e=>{state.kind=e.target.value;redraw()});
function zoom(f){const mid=(state.start+state.end)/2,half=(state.end-state.start)*f/2;state.start=Math.max(0,mid-half);state.end=Math.min(fullEnd,mid+half);redraw()}
document.querySelector("#zoomIn").onclick=()=>zoom(.5);document.querySelector("#zoomOut").onclick=()=>zoom(2);
document.querySelector("#reset").onclick=()=>{state.start=0;state.end=fullEnd;state.query="";state.kind="all";document.querySelector("#search").value="";document.querySelector("#kind").value="all";redraw()};
addEventListener("resize",redraw);redraw();
</script>
</body>
</html>
