<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner memory profile</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font:13px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#050505;background:#fff}header,main{padding:16px 20px}header{border-bottom:1px solid #000}h1{margin:0;font-size:20px}p{margin:0}.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:#303030;margin-top:4px}main{display:grid;gap:18px}section{border:1px solid #000}.section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid #000}.legend,.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}.legend{font-size:11px}.legend span{display:inline-flex;align-items:center;gap:5px}.line{width:22px;border-top:2px solid #000}.standard{border-top-style:dashed}.interleaved{border-top-style:dotted}.budget{border-top:1px solid #777}#chart{display:block;width:100%;height:250px;cursor:crosshair}select,input,button{height:30px;border:1px solid #000;border-radius:0;background:#fff;color:#050505;padding:0 9px;font:inherit}button,summary{cursor:pointer}button:hover{background:#eee}input[type=checkbox]{height:auto;accent-color:#000}label{display:inline-flex;align-items:center;gap:6px}select{max-width:100%}.step{padding:10px 12px;border-top:1px solid #000;display:grid;gap:6px}#operation{overflow-wrap:anywhere}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{text-align:left;padding:7px 12px;border-bottom:1px solid #bbb;vertical-align:top}th{border-bottom:1px solid #000;white-space:nowrap}tr:last-child td{border-bottom:0}td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.muted{color:#303030;white-space:pre-wrap;overflow-wrap:anywhere}details{max-width:700px}#invalid:empty{display:none}#invalid{font-weight:700;margin-top:6px}
</style>
<header><h1>Planner memory profile</h1><p id="context" class="stats"></p><div id="peaks" class="stats"></div><p id="invalid"></p></header>
<main><section><div class="section-head"><strong>Estimated live memory · selected tile</strong><div class="legend"><span><i class="line"></i>Total + support</span><span><i class="line standard"></i>Standard + support</span><span><i class="line interleaved"></i>Interleaved</span><span><i class="line budget"></i>Budget</span></div></div>
<svg id="chart" viewBox="0 0 1000 250" role="img" aria-label="Estimated live memory by primitive step"></svg>
<div class="step"><div class="controls"><label>Tile <input id="tile" type="number" min="0" value="0" style="width:80px"></label><button id="stepPeak">Step’s peak tile</button><button id="totalPeak">Total peak</button><button id="standardPeak">Standard peak</button><button id="interleavedPeak">Interleaved peak</button><select id="step" aria-label="Primitive step"></select></div><p id="operation"></p><p id="usage" class="stats"></p></div></section>
<section><div class="section-head"><strong>Live allocations</strong><div class="controls"><input id="filter" placeholder="Filter allocations" aria-label="Filter allocations"><label><input type="checkbox" id="group" checked>Group sequences / values</label></div></div>
<div class="table-wrap"><table><thead><tr><th>Allocation / group</th><th>Class</th><th>Copies</th><th>Payload, B</th><th>Padding, B</th><th>Total, B</th></tr></thead><tbody id="allocations"></tbody></table></div></section></main>
<script type="application/json" id="data">__PROFILE_JSON__</script>
<script>
'use strict';
const p=JSON.parse(document.getElementById('data').textContent), steps=p.timeline.steps, roots=new Map();
const number=x=>x.toLocaleString('en-US'), kib=x=>(x/1024).toFixed(1)+' KiB';
for(const v of p.timeline.values){if(!roots.has(v.root))roots.set(v.root,[]);roots.get(v.root).push(v);}
document.getElementById('context').textContent=p.scope+' · '+p.tile_count+' tiles';
document.getElementById('invalid').textContent=p.timeline.values.some(v=>v.layout_error)?'Invalid layout: memory estimate unavailable.':'';
for(const text of ['Peak '+kib(p.effective_peak_bytes)+' / '+kib(p.budget_bytes)+' · '+(p.fits_budget?'PASS':'FAIL'),'Old bound '+kib(Math.max(...steps.map(s=>s.coarse_usage.standard+s.coarse_usage.interleaved))+p.support_reserve_bytes),'Support '+kib(p.support_reserve_bytes),'Exchange estimate '+kib(p.peak.exchange_rows),'Interleaved limit '+kib(p.interleaved_budget_bytes),...(p.standard_contiguous_overflow_bytes?['Contiguous overflow '+kib(p.standard_contiguous_overflow_bytes)]:[])]){const span=document.createElement('span');span.textContent=text;document.getElementById('peaks').append(span);}
const select=document.getElementById('step'), tileSelect=document.getElementById('tile');tileSelect.max=p.tile_count-1;
const peakTile=(step,axis)=>step.tile_usage.reduce((best,u,i)=>{const value=v=>axis===undefined?v[0]+v[1]:v[axis];return value(u)>value(step.tile_usage[best])?i:best;},0);
for(const s of steps){const option=document.createElement('option');option.value=s.index;option.textContent=s.index+': source '+(s.source??'none')+' · '+s.operation.slice(0,110);select.append(option);}
const chart=document.getElementById('chart'), ns='http://www.w3.org/2000/svg';
const max=Math.max(p.budget_bytes,...steps.map(s=>s.usage.standard+s.usage.interleaved+p.support_reserve_bytes))*1.08;
const x=i=>50+i*930/Math.max(1,steps.length-1), y=v=>225-v*205/max;
function svg(tag,attributes){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attributes))e.setAttribute(k,v);chart.append(e);return e;}
svg('line',{x1:50,x2:980,y1:y(p.budget_bytes),y2:y(p.budget_bytes),stroke:'#777'});
const curves=['8 4','2 4','none'].map(dash=>svg('polyline',{fill:'none',stroke:'#000','stroke-width':2,'stroke-dasharray':dash}));
for(let i=0;i<=4;i++){const v=max*i/4;svg('text',{x:0,y:y(v),'font-size':11}).textContent=Math.round(v/1024)+'K';}
const marker=svg('line',{x1:50,x2:50,y1:15,y2:230,stroke:'#aaa'});
chart.onclick=e=>{const point=new DOMPoint(e.clientX,e.clientY).matrixTransform(chart.getScreenCTM().inverse());select.value=Math.max(0,Math.min(steps.length-1,Math.round((point.x-50)/930*(steps.length-1))));render();};
for(const [id,key,axis]of [['totalPeak','total_peak_step',undefined],['standardPeak','standard_peak_step',0],['interleavedPeak','interleaved_peak_step',1]])document.getElementById(id).onclick=()=>{select.value=p[key]??0;tileSelect.value=peakTile(steps[+select.value],axis);render();};
document.getElementById('stepPeak').onclick=()=>{tileSelect.value=peakTile(steps[+select.value]);render();};
function render(){const s=steps[Number(select.value)];if(!s)return;const tile=Math.max(0,Math.min(p.tile_count-1,Math.trunc(Number(tileSelect.value))));tileSelect.value=tile;curves.forEach((curve,axis)=>curve.setAttribute('points',steps.map((step,i)=>{const u=step.tile_usage[tile];return x(i)+','+y(axis===0?u[0]+p.support_reserve_bytes:axis===1?u[1]:u[0]+u[1]+p.support_reserve_bytes);}).join(' ')));marker.setAttribute('x1',x(s.index));marker.setAttribute('x2',x(s.index));
 document.getElementById('operation').textContent='Tile '+tile+' · step '+s.index+' · source '+(s.source??'none')+' · ×'+s.execution_count+' · '+s.operation;
 document.getElementById('usage').textContent='Standard '+kib(s.tile_usage[tile][0])+' · Interleaved '+kib(s.tile_usage[tile][1])+' · Scratch '+kib(s.tile_scratch[tile][0])+' standard / '+kib(s.tile_scratch[tile][1])+' interleaved';
 const grouped=document.getElementById('group').checked, query=document.getElementById('filter').value.toLowerCase(), groups=new Map();
 for(const id of s.live){const aliases=roots.get(id);if(!aliases)continue;const source=aliases.reduce((a,b)=>a.tile_bytes[tile]>=b.tile_bytes[tile]?a:b);const v={...source,bytes:source.tile_bytes[tile],shard_bytes:source.tile_shards[tile],aligned_bytes:source.tile_bytes[tile]/source.copies,aliases:aliases.map(v=>v.id)};if(!v.bytes)continue;const key=grouped?v.group+' / '+v.class:'allocation '+id;
 if(!groups.has(key))groups.set(key,{name:grouped?v.group:'allocation '+id+': '+v.name,class:v.class,copies:0,shard:0,padding:0,bytes:0,values:[]});
 const g=groups.get(key);g.copies+=v.copies;g.shard+=v.shard_bytes*v.copies;g.padding+=(v.aligned_bytes-v.shard_bytes)*v.copies;g.bytes+=v.bytes;g.values.push(v);}
 const table=document.getElementById('allocations');table.replaceChildren();
 for(const g of [...groups.values()].sort((a,b)=>b.bytes-a.bytes)){if(query&&!JSON.stringify(g).toLowerCase().includes(query))continue;
 const tr=document.createElement('tr'), label=document.createElement('td'), details=document.createElement('details'), summary=document.createElement('summary');summary.textContent=g.name;details.append(summary);
 const explanation=document.createElement('div');explanation.className='muted';explanation.textContent=g.values.map(v=>'root '+v.root+'; aliases '+v.aliases.join(',')+'; origin '+v.origin+'; '+v.precision+' ['+v.shape.join(',')+']; '+v.layout).join('\n');details.append(explanation);label.append(details);tr.append(label);
 for(const value of [g.class.replace('Ipu21',''),g.copies,g.shard,g.padding,g.bytes]){const td=document.createElement('td');td.textContent=typeof value==='number'?number(value):value;if(typeof value==='number')td.className='num';tr.append(td);}table.append(tr);}
}
select.value=p.total_peak_step??0;if(steps.length)tileSelect.value=peakTile(steps[+select.value]);select.onchange=render;tileSelect.oninput=render;document.getElementById('filter').oninput=render;document.getElementById('group').onchange=render;render();
</script>

</html>
